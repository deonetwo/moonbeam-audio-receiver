name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Single-File Executable
        run: |
          dotnet publish src/MoonbeamAudioReceiver/MoonbeamAudioReceiver.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/MoonbeamAudioReceiver.exe -DestinationPath ./MoonbeamAudioReceiver-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Moonbeam Audio Receiver ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            ./MoonbeamAudioReceiver-win-x64.zip
            ./publish/MoonbeamAudioReceiver.exe
          draft: false
          prerelease: false
          generate_release_notes: true
